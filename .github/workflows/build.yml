name: Build Dyanogenmod ROM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32z1-dev libgl1-mesa-dev libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Initialize Source Code & Sync
      run: |
        mkdir android
        cd android
        git config --global user.email "you@example.com"
        git config --global user.name "YourName"
        repo init -u https://github.com/LineageOS/android.git -b lineage-15.1 --depth=1
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Clone Device Tree
      run: |
        cd android
        git clone https://github.com/${{ github.repository }} device/samsung/j5xnlte

    - name: Build Dyanogenmod ROM
      run: |
        cd android
        source build/envsetup.sh
        lunch dyanogenmod_j5xnlte-userdebug
        mka bacon -j$(nproc --all)

    - name: Upload Built ROM
      uses: actions/upload-artifact@v4
      with:
        name: Dyanogenmod-ROM-j5xnlte
        path: android/out/target/product/j5xnlte/*.zip
